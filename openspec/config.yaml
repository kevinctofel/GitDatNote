schema: spec-driven
context: |
  GitDatNote 2.0 is an open-source CMS for GitHub-backed Eleventy blogs.
  Existing repository: https://github.com/kevinctofel/GitDatNote
  This is a brownfield modernization. Inspect actual source before editing it.
  MVP: local/self-hostable CMS, secure GitHub connectivity, article management,
  Eleventy blog generation, GitHub Pages publishing for eligible blogs,
  and a guided optional custom-domain workflow.
  Future (not MVP): hosted SaaS, managed subdomains, billing, AI writing,
  multi-author workflows, and alternative hosts.
  User principles: own repository/content/domain; no vendor lock-in; an
  approachable experience for nontechnical bloggers; Markdown portability.
  Technical preference: TypeScript, React, Vite, Node backend, Octokit,
  Eleventy; decisions may be changed with explicit rationale.
  No auth secrets in the frontend. AI is not required for product runtime.
rules:
  proposal:
    - State motivation, in-scope, out-of-scope, and rollback plan.
    - Identify impact on existing GitDatNote code and SecondBrain assumptions.
  specs:
    - Use SHALL/MUST requirements and Given/When/Then scenarios.
    - Include authentication failures, conflicts, and destructive-operation safety.
    - Keep requirements observable and testable.
  design:
    - Separate observed repo facts from proposals requiring validation.
    - Record alternatives, threat model, and unresolved decisions.
  tasks:
    - Keep each checklist item independently testable and sized for a local coding model.
    - Do not mark tasks complete without evidence from tests or review.
